# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

project_name: registry

builds:
  - id: registry
    main: ./cmd/registry
    binary: registry
    env:
      - CGO_ENABLED=0
      - GO111MODULE=auto
    flags:
      - -trimpath
    tags:
      - include_oss
      - include_gcs
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/docker/distribution/version.Version={{ .Tag }}
      - -X github.com/docker/distribution/version.Revision={{ .Commit }}
      - -X github.com/docker/distribution/version.Package=github.com/docker/distribution

archives:
  - id: registry-archive
    format: tar.gz
    name_template: >-
      registry_{{- title .Os }}_{{ .Arch }}
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |-

    ---

    This release is intended for use only as part of the Alauda product suite.
    It is not recommended for use by individuals or teams outside of Alauda.
    Any consequences arising from its use are the sole responsibility of the user.
