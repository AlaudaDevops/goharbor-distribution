apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: goharbor-distribution
  title: Harbor Distribution Fork
  description: Harbor 使用的 distribution fork，用于 Harbor registry 构建和发布镜像。
  annotations:
    # github plugin
    github.com/project-slug: AlaudaDevops/goharbor-distribution
    # 开源组件代码仓库地址，格式：${url}/${project}/${repo}
    acp.cpaas.io/open-source-component-repo: https://github.com/goharbor/distribution
    # 开源组件的版本信息，只适用于开源组件，自研组件默认不收集版本信息,格式 ${version}
    acp.cpaas.io/open-source-component-version: v2.8.3
    # 开源组件的license信息,格式 ${license}
    acp.cpaas.io/open-source-component-license: Apache-2.0
    # 开源组件的license地址,格式 ${url}/${project}/${repo}/${license-path}
    acp.cpaas.io/open-source-component-license_url: https://github.com/goharbor/distribution/blob/main/LICENSE
    # backstage techdocs plugin
    backstage.io/techdocs-ref: dir:.
    acp.cpaas.io/owner: jtcheng@alauda.io

    acp.cpaas.io/functional-attributes: plugin
spec:
  type: service
  system: system:devops-tools
  lifecycle: production
  owner: devops
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: devops-tools
  title: Devops Tools
  tags:
  - golang
  - devops
spec:
  owner: devops
  domain: devops
