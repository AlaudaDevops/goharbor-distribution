name: Release Alauda

on:
  workflow_call:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: alauda-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0
          path: src/github.com/docker/distribution

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.10"
          cache: false

      - name: Prepare GOPATH workspace
        run: |
          echo "GOPATH=${GITHUB_WORKSPACE}" >> "${GITHUB_ENV}"
          echo "GO111MODULE=auto" >> "${GITHUB_ENV}"

      - name: Release binaries
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.1.0
          args: release --clean -f=goreleaser-alauda.yml
          workdir: src/github.com/docker/distribution
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
