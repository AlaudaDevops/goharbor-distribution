name: Release Alauda

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: alauda-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.6
        with:
          fetch-depth: 0
          path: src/github.com/docker/distribution

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.20.10"
          cache: false

      - name: Build release archives
        working-directory: ${{ github.workspace }}/src/github.com/docker/distribution
        run: |
          set -euo pipefail

          export GOPATH="${GITHUB_WORKSPACE}"
          export GO111MODULE=auto
          export BUILDTAGS="include_oss include_gcs"

          OUT_DIR="${RUNNER_TEMP}/release-assets"
          mkdir -p "${OUT_DIR}"

          for arch in amd64 arm64; do
            echo "Building registry for ${arch}"
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 make clean binaries
            tar -C bin -czf "${OUT_DIR}/registry_Linux_${arch}.tar.gz" registry
          done

          (cd "${OUT_DIR}" && sha256sum registry_Linux_*.tar.gz > checksums.txt)

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          files: |
            ${{ runner.temp }}/release-assets/registry_Linux_amd64.tar.gz
            ${{ runner.temp }}/release-assets/registry_Linux_arm64.tar.gz
            ${{ runner.temp }}/release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
